[package]
name    = "oxide"
version = "0.1.0"
edition = "2021"
authors = ["SantianDev"]
description = "Oxide - MCPE 1.1.5 server software in Rust"

[[bin]]
name = "oxide"
path = "src/main.rs"

[lib]
name = "oxide"
path = "src/lib.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
bytes              = "1"
dashmap            = "5"
parking_lot        = "0.12"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
flate2             = "1"
uuid               = { version = "1", features = ["v4"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror          = "1"
anyhow             = "1"
rand               = "0.8"
base64             = "0.21"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 1
